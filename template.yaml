AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Learning lab - IAM-protected sandbox-only Stripe status agent with MCP fallback

Parameters:
  StripeSecretArn:
    Type: String
    Description: ARN of an existing AWS Secrets Manager secret holding sk_test_ Stripe key
  AllowedPaymentIntentIds:
    Type: String
    Description: Comma-separated Stripe sandbox pi_... IDs allowed for this lab (not wildcards)
    AllowedPattern: 'pi_[a-zA-Z0-9]+(,pi_[a-zA-Z0-9]+)*'
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock Converse model ID; availability depends on Region/account
  SimulateMcpOutage:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 30
    Architectures: [x86_64]
    Environment:
      Variables:
        STRIPE_SECRET_ARN: !Ref StripeSecretArn
        ALLOWED_PAYMENT_INTENT_IDS: !Ref AllowedPaymentIntentIds

Resources:
  PaymentApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: AWS_IAM
      TracingEnabled: true

  McpServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.mcp_protocol.lambda_handler
      Description: Stateless JSON-RPC MCP subset for Stripe sandbox read-only status
      Environment:
        Variables:
          SIMULATE_MCP_OUTAGE: !Ref SimulateMcpOutage
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref StripeSecretArn
      Events:
        McpPost:
          Type: Api
          Properties:
            RestApiId: !Ref PaymentApi
            Path: /mcp
            Method: post

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.agent_lambda.lambda_handler
      Description: Bedrock agent with MCP + direct Stripe fallback
      Environment:
        Variables:
          MCP_URL: !Sub 'https://${PaymentApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/mcp'
          MCP_AWS_IAM: '1'
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref StripeSecretArn
            - Effect: Allow
              Action: execute-api:Invoke
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentApi}/Prod/POST/mcp'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref PaymentApi
            Path: /chat
            Method: post

Outputs:
  ChatUrl:
    Description: IAM-protected chat endpoint; call via signed script
    Value: !Sub 'https://${PaymentApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/chat'
  McpUrl:
    Description: IAM-protected MCP endpoint
    Value: !Sub 'https://${PaymentApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/mcp'
  AgentLambdaName:
    Value: !Ref AgentFunction
  McpLambdaName:
    Value: !Ref McpServerFunction
